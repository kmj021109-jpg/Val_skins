name: build-exe

# v1.0.0 같은 태그를 푸시하면 Windows에서 exe를 빌드해 Releases에 올립니다.
# Actions 탭에서 수동 실행(workflow_dispatch)도 가능합니다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pyinstaller
      - run: pyinstaller --onefile --name ValorantOwnedExporter fetch_owned.py
      - uses: actions/upload-artifact@v4
        with:
          name: ValorantOwnedExporter
          path: dist/ValorantOwnedExporter.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ValorantOwnedExporter.exe
